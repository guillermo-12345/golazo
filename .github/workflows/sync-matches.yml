name: Sincronizar partidos con API-Football

# IMPORTANTE: este workflow llama a API-Football, que requiere una key real
# (no la 'placeholder'). Si lo activas con cron antes de tener la key real,
# va a fallar cada 6 horas con error 403/401.
#
# Cuando obtengas la key:
# 1. Actualiza API_FOOTBALL_KEY en Vercel (Environment Variables)
# 2. Descomenta el bloque schedule abajo
# 3. Push

on:
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-matches:
    name: Sync completo del fixture
    runs-on: ubuntu-latest
    steps:
      - name: Sync completo
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Secrets APP_URL o SUPABASE_SERVICE_KEY no configurados. Saltando."
            exit 0
          fi
          curl --fail-with-body -X POST "$APP_URL/api/matches/sync" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json"
