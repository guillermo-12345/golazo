name: Sync resultados (ESPN)

on:
  schedule:
    # Cada 20 minutos durante el Mundial (11 jun - 19 jul 2026).
    # ESPN es gratis: esto NO consume consultas de API-Football.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Sincronizar toda la fase de grupos (no solo ayer/hoy/mañana)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al endpoint de sync ESPN
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL: ${{ inputs.full && '1' || '' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::error::Faltan secrets APP_URL o SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          # Normalizar APP_URL: sin espacios, https forzado y sin barras finales
          # (una barra final o http:// producen redirecciones 308 de Vercel)
          BASE=$(echo "$APP_URL" | tr -d '[:space:]' | sed -e 's:/*$::' -e 's:^http\://:https\://:')
          case "$BASE" in
            https://*) : ;;
            *) BASE="https://$BASE" ;;
          esac

          URL="$BASE/api/matches/sync-espn"
          if [ "$FULL" = "1" ]; then
            URL="$URL?full=1"
          fi

          echo "POST $URL"
          # -L sigue redirecciones (308 preserva el método POST)
          HTTP_CODE=$(curl -sS -L -o response.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $SERVICE_KEY")

          cat response.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Sync falló con HTTP $HTTP_CODE (URL final: $URL). Revisá que APP_URL sea el dominio público de producción."
            exit 1
          fi
