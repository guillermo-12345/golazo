name: Recordatorios de predicción

# Corre cada 5 min. El endpoint internamente solo manda notificaciones a
# usuarios que no predijeron partidos por arrancar en ~15 min.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    name: Mandar notificaciones a quien no predijo
    runs-on: ubuntu-latest
    steps:
      - name: Mandar recordatorios
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Secrets APP_URL o SUPABASE_SERVICE_KEY no configurados. Saltando."
            exit 0
          fi
          curl --fail-with-body -X GET "$APP_URL/api/cron/prediction-reminders" \
            -H "Authorization: Bearer $SUPABASE_KEY"
