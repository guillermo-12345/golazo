name: Recordatorios de predicción

# Activado: corre cada 5 min pero el endpoint internamente solo manda notificaciones
# si hay partidos que arrancan en ~15 minutos. Hasta el Mundial no manda nada.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    name: Mandar notificaciones a quien no predijo
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            echo "::warning::Secrets no configurados. Saltando."
            exit 0
          fi
      - name: Llamar al endpoint de recordatorios
        if: ${{ secrets.APP_URL != '' && secrets.SUPABASE_SERVICE_KEY != '' }}
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/prediction-reminders" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            --fail-with-body
