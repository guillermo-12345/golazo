name: Sincronizar partidos con API-Football

# IMPORTANTE: este workflow llama a API-Football, que requiere una key real
# (no la 'placeholder'). Si la activás antes de tener la key, va a fallar
# cada 6 horas con error 403/401.
#
# Cuando obtengas la key:
# 1. Actualizá API_FOOTBALL_KEY en Vercel
# 2. Descomentá el bloque schedule abajo
# 3. Listo

on:
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-matches:
    name: Sync completo del fixture
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            echo "::warning::Secrets no configurados. Saltando."
            exit 0
          fi
      - name: Llamar al endpoint de sync
        if: ${{ secrets.APP_URL != '' && secrets.SUPABASE_SERVICE_KEY != '' }}
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/matches/sync" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
