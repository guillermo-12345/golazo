name: Sincronizar scores en vivo

# Corre cada 5 min. El endpoint internamente salta si no hay partidos
# en vivo ni proximos en 1h, asi que no consume API-Football fuera del Mundial.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync-live:
    name: Actualizar scores en vivo
    runs-on: ubuntu-latest
    steps:
      - name: Sync de scores en vivo
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Secrets APP_URL o SUPABASE_SERVICE_KEY no configurados. Saltando."
            exit 0
          fi
          curl --fail-with-body -X POST "$APP_URL/api/matches/sync?live=1" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json"
