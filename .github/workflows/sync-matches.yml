name: Sincronizar partidos con API-Football

# DESACTIVADO hasta que tengas API-Football key configurada.
# Para activar:
# 1. Settings -> Secrets and variables -> Actions -> agregar APP_URL y SUPABASE_SERVICE_KEY
# 2. Descomentar el bloque "schedule:" de abajo
# Mientras tanto, podés ejecutarlo manualmente desde Actions -> "Run workflow"

on:
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-matches:
    name: Sync completo del fixture
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            echo "::warning::Secrets no configurados. Saltando."
            exit 0
          fi
      - name: Llamar al endpoint de sync
        if: ${{ secrets.APP_URL != '' && secrets.SUPABASE_SERVICE_KEY != '' }}
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/matches/sync" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
