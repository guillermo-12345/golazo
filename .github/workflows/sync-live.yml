name: Sincronizar scores en vivo

# Llama al endpoint /api/cron/sync-live (wrapper inteligente) que internamente
# salta si no hay partidos en vivo ni programados en la proxima hora, asi que
# no consume cuota de API-Football fuera del Mundial.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync-live:
    name: Actualizar scores en vivo
    runs-on: ubuntu-latest
    steps:
      - name: Sync de scores en vivo
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Secrets APP_URL o SUPABASE_SERVICE_KEY no configurados. Saltando."
            exit 0
          fi
          curl --fail-with-body -X GET "$APP_URL/api/cron/sync-live" \
            -H "Authorization: Bearer $SUPABASE_KEY"
