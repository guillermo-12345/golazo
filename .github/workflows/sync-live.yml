name: Sincronizar scores en vivo

# DESACTIVADO hasta que tengas API-Football key + secrets configurados.
# Activar 1 semana antes del Mundial descomentando el bloque schedule.

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync-live:
    name: Actualizar scores en vivo
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            echo "::warning::Secrets no configurados. Saltando."
            exit 0
          fi
      - name: Llamar al endpoint de sync en vivo
        if: ${{ secrets.APP_URL != '' && secrets.SUPABASE_SERVICE_KEY != '' }}
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/matches/sync?live=1" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
